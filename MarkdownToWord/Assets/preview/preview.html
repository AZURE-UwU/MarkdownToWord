<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://assets.local/katex/katex.min.css" />
  <link rel="stylesheet" href="https://assets.local/hljs/github.min.css" />
  <link rel="stylesheet" href="https://assets.local/preview.css" />
</head>
<body>
  <div id="content" class="markdown-body empty"></div>

  <script src="https://assets.local/katex/katex.min.js"></script>
  <script src="https://assets.local/katex/auto-render.min.js"></script>
  <script src="https://assets.local/hljs/highlight.min.js"></script>
  <script>
    (function () {
      var content = document.getElementById('content');

      document.addEventListener('keydown', function (event) {
        if (!event.ctrlKey || event.altKey || event.shiftKey || event.key.toLowerCase() !== 'c') {
          return;
        }

        var selection = window.getSelection();
        if (selection && selection.toString().length > 0) {
          return;
        }

        event.preventDefault();
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage('copy-word');
        }
      }, true);

      window.renderMarkdown = function (html, dark, mathEnabled) {
        document.body.classList.toggle('dark', !!dark);
        content.innerHTML = html || '';
        content.classList.toggle('empty', !html);

        if (window.hljs) {
          content.querySelectorAll('pre code').forEach(function (block) {
            try { hljs.highlightElement(block); } catch (e) { /* 忽略未知语言 */ }
          });
        }

        if (mathEnabled && window.renderMathInElement) {
          try {
            renderMathInElement(content, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false,
              errorColor: '#cf222e'
            });
          } catch (e) { /* 公式渲染失败不影响正文 */ }
        }
      };

      window.renderError = function (message) {
        content.classList.remove('empty');
        content.innerHTML = '<p class="katex-error"></p>';
        content.querySelector('p').textContent = message;
      };

      window.previewReady = true;
    })();
  </script>
</body>
</html>
